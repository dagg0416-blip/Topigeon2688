<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101827"><title>2688 賽鴿分析</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#e8edf5;background:#0b1220}body{margin:0;background:#0b1220}.wrap{max-width:960px;margin:auto;padding:18px}.card{background:#111b2e;border:1px solid #22304a;border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 8px 30px #0003}h1{font-size:25px;margin:4px 0}h2{font-size:17px;margin:0 0 12px}.muted{color:#9eabc0;font-size:13px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#0b1425;border-radius:14px;padding:12px}.stat b{display:block;font-size:22px;margin-top:4px}label{font-size:13px;color:#b8c4d7;display:block;margin-bottom:5px}input,textarea,button{box-sizing:border-box;width:100%;border-radius:12px;border:1px solid #31415e;background:#0b1425;color:#eef4ff;padding:12px;font-size:16px}textarea{min-height:145px;font-family:ui-monospace,monospace;font-size:12px}button{background:#e8edf5;color:#0b1220;font-weight:700;border:0;margin-top:10px}button.secondary{background:#23324b;color:#fff}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:10px 7px;border-bottom:1px solid #26344d;text-align:left;white-space:nowrap}.scroll{overflow:auto}.bad{color:#ff9a9a}.good{color:#92e6b5}.note{font-size:12px;color:#aab6ca;line-height:1.55}.pill{display:inline-block;background:#24334e;border-radius:999px;padding:5px 9px;font-size:12px;margin:3px 3px 0 0}@media(max-width:600px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(3,1fr)}.wrap{padding:12px}.stat b{font-size:18px}}
</style></head><body><div class="wrap"><div class="card"><h1>2688 賽鴿分析</h1><div class="muted">金溪湖鴿會 · 自訓 · 鴿舍 2688</div></div>
<div class="card"><h2>查詢條件</h2><div class="grid"><div><label>日期</label><input id="date" type="date" value="2026-09-26"></div><div><label>施放地點</label><input id="releasePlace" placeholder="例如 三義交流道、后里"><div id="distanceInfo" class="note" style="margin-top:5px">將自動換算至埔鹽國中的直線距離</div></div><div><label>施放時間（若資料未帶出）</label><input id="release" type="time" step="1"></div><div><label>自訓密碼（若需要）</label><input id="pass" type="password" autocomplete="off"></div></div><button id="fetch">抓取 TOPIGEON</button><div id="fetchMsg" class="note" style="margin-top:8px">直接抓取需要部署時設定伺服器代理；若尚未部署，可用下方貼入模式測試分析。</div></div>
<div class="card"><h2>貼入資料／HTML（備援）</h2><textarea id="raw" placeholder="可貼 TOPIGEON 表格文字或完整 HTML。格式例如：\n51 51 2688 75 12:30:33.645\n50 50 2688 72 09:28:46.652"></textarea><button class="secondary" id="analyze">分析貼入資料</button></div>
<div class="card"><h2>當日摘要</h2><div class="stats"><div class="stat"><span class="muted">有效歸返</span><b id="returned">—</b></div><div class="stat"><span class="muted">未歸返</span><b id="missingN">—</b></div><div class="stat"><span class="muted">原始紀錄</span><b id="rawN">—</b></div></div><div id="missing" class="note" style="margin-top:12px">尚未建立完整鴿隊名單，因此未歸返需有母名單才能準確判斷。</div></div>
<div class="card"><h2>有效返舍紀錄</h2><div class="scroll"><table><thead><tr><th>排名</th><th>環號</th><th>返舍時間</th><th>飛行時間</th><th>速度 km/h</th></tr></thead><tbody id="rows"><tr><td colspan="5" class="muted">尚無資料</td></tr></tbody></table></div><p class="note">規則 v1：同一環號只保留當次施放後第一次有效返舍。下午家飛再次感應不列入比較；但不會單純把所有下午返舍刪除，以免誤刪真正晚歸鴿。</p></div>
<div class="card"><h2>完整鴿隊名單</h2><textarea id="roster" placeholder="一行一個環號，例如：\n01\n06\n07\n...（儲存在這支手機瀏覽器）"></textarea><button class="secondary" id="saveRoster">儲存名單</button></div>
</div><script>
const $=id=>document.getElementById(id);
const LOFT={name:'埔鹽國中',lat:24.00031,lon:120.46634};
const PLACES={
 '三義交流道':{lat:24.3892633,lon:120.769476},
 '三義':{lat:24.3892633,lon:120.769476},
 '后里':{lat:24.30502,lon:120.71075}
};
let currentDistance=null;
function haversine(a,b){const R=6371,rad=x=>x*Math.PI/180,dLat=rad(b.lat-a.lat),dLon=rad(b.lon-a.lon),la1=rad(a.lat),la2=rad(b.lat);const h=Math.sin(dLat/2)**2+Math.cos(la1)*Math.cos(la2)*Math.sin(dLon/2)**2;return 2*R*Math.asin(Math.sqrt(h));}
function updateDistance(){let q=$('releasePlace').value.trim(),p=PLACES[q];if(!p){currentDistance=null;$('distanceInfo').textContent=q?'目前尚未內建此地點座標；後續接上地點搜尋後可自動查詢。':'將自動換算至埔鹽國中的直線距離';return;}currentDistance=haversine(p,LOFT);$('distanceInfo').textContent=`${q} → ${LOFT.name}：直線距離約 ${currentDistance.toFixed(2)} km`;if($('raw').value.trim())run($('raw').value);}
$('releasePlace').addEventListener('change',updateDistance);
$('releasePlace').addEventListener('blur',updateDistance);
 $('roster').value=localStorage.getItem('roster2688')||'';
$('saveRoster').onclick=()=>{localStorage.setItem('roster2688',$('roster').value); alert('已儲存鴿隊名單');};
function sec(t){let a=t.split(':'); if(a.length<2)return null; return (+a[0])*3600+(+a[1])*60+parseFloat(a[2]||0)}
function dur(s){if(s==null||s<0)return '';let h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=(s%60).toFixed(3).padStart(6,'0');return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+x}
function parse(text){let out=[]; let re=/(\d+)\s+(\d+)\s+2688\s+(\d{1,4})\s+(\d{1,2}:\d{2}:\d{2}(?:\.\d+)?)/g,m; while((m=re.exec(text)))out.push({s1:+m[1],s2:+m[2],ring:m[3].padStart(2,'0'),time:m[4]}); if(!out.length && /<[^>]+>/.test(text)){let d=new DOMParser().parseFromString(text,'text/html'); d.querySelectorAll('tr').forEach(tr=>{let c=[...tr.querySelectorAll('td')].map(x=>x.textContent.trim()); if(c.length>=5&&/^\d+$/.test(c[0])&&/^\d+$/.test(c[1])&&c[2]=='2688')out.push({s1:+c[0],s2:+c[1],ring:c[3].padStart(2,'0'),time:c[4]})})} return out}
function run(text){let raw=parse(text), rel=$('release').value?sec($('release').value):null, map=new Map(); raw.sort((a,b)=>sec(a.time)-sec(b.time)); raw.forEach(r=>{let rt=sec(r.time); if(rel!=null&&rt<rel)return; if(!map.has(r.ring))map.set(r.ring,r)}); let v=[...map.values()].sort((a,b)=>sec(a.time)-sec(b.time)),dist=currentDistance, roster=$('roster').value.split(/\s+/).map(x=>x.trim().padStart(2,'0')).filter(Boolean), returned=new Set(v.map(x=>x.ring)), missing=roster.filter(x=>!returned.has(x)); $('returned').textContent=v.length; $('rawN').textContent=raw.length; $('missingN').textContent=roster.length?missing.length:'—'; $('missing').innerHTML=roster.length?(missing.length?'<span class="bad">未歸返：</span>'+missing.map(x=>'<span class="pill">'+x+'</span>').join(''):'<span class="good">名單內全數歸返</span>'):'尚未建立完整鴿隊名單，因此未歸返需有母名單才能準確判斷。'; $('rows').innerHTML=v.length?v.map((r,i)=>{let ft=rel==null?null:sec(r.time)-rel; if(ft<0)ft+=86400; let sp=(dist&&ft>0)?(dist/(ft/3600)).toFixed(2):''; return `<tr><td>${i+1}</td><td>${r.ring}</td><td>${r.time}</td><td>${dur(ft)}</td><td>${sp}</td></tr>`}).join(''):'<tr><td colspan="5" class="muted">沒有解析到 2688 紀錄</td></tr>'}
$('analyze').onclick=()=>run($('raw').value);
$('fetch').onclick=async()=>{let d=$('date').value.replaceAll('-','/'); $('fetchMsg').textContent='正在嘗試抓取 '+d+'…'; try{let u='/api/topigeon?date='+encodeURIComponent(d)+'&pass='+encodeURIComponent($('pass').value);let r=await fetch(u);if(!r.ok)throw Error('HTTP '+r.status);let j=await r.json(); if(j.release_time&&!$('release').value)$('release').value=j.release_time; if(j.release_place&&!$('releasePlace').value){$('releasePlace').value=j.release_place;updateDistance();} $('raw').value=j.raw_text||j.html||''; run($('raw').value); $('fetchMsg').textContent='抓取完成：共 '+(j.count||0)+' 筆 TOPIGEON 紀錄';}catch(e){$('fetchMsg').textContent='抓取失敗：'+e.message+'。若已部署，請檢查後端紀錄或自訓密碼。';}}
</script></body></html>
